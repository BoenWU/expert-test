<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>403 Forbidden · 禁止访问</title>
<style>
  *,
  *::before,
  *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    -webkit-text-size-adjust: 100%;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: #f6f7f9;
    color: #1f2329;
    text-align: center;
  }

  .panel {
    max-width: 560px;
  }

  .status-code {
    font-size: clamp(96px, 24vw, 192px);
    font-weight: 700;
    line-height: 1;
    letter-spacing: 0.04em;
    color: #c62f2f;
  }

  .status-title {
    margin-top: 24px;
    font-size: clamp(22px, 5vw, 32px);
    font-weight: 600;
    line-height: 1.3;
    color: #1f2329;
  }

  .status-title .en {
    font-weight: 400;
    color: #646a73;
  }

  .divider {
    width: 64px;
    height: 4px;
    margin: 24px auto;
    border-radius: 2px;
    background: #c62f2f;
  }

  .description {
    font-size: 16px;
    line-height: 1.7;
    color: #3b4150;
  }

  .hint {
    margin-top: 12px;
    font-size: 14px;
    line-height: 1.7;
    color: #8a919e;
  }

  @media (max-width: 480px) {
    body {
      padding: 16px;
    }

    .description {
      font-size: 15px;
    }
  }
</style>
</head>
<body>
<main class="panel">
  <p class="status-code">403</p>
  <h1 class="status-title">禁止访问 <span class="en">Forbidden</span></h1>
  <div class="divider" aria-hidden="true"></div>
  <p class="description">抱歉，您没有权限访问此页面或资源，本次访问请求已被拒绝。</p>
  <p class="hint">如果您认为这是一个错误，请联系网站管理员申请相应的访问权限。</p>
</main>
</body>
</html>
