<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>首页</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; }
  body {
    height: 100%;
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
    background: #f4f5f7;
    color: #1f2329;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 48px 24px;
  }
  .title {
    font-size: 26px;
    font-weight: 600;
    color: #1f2329;
  }
  .description {
    margin-top: 12px;
    max-width: 480px;
    font-size: 15px;
    line-height: 1.7;
    color: #646a73;
  }
</style>
</head>
<body>
  <main class="page">
    <h1 class="title">首页</h1>
    <p class="description">这里是站点首页。当前站点以纯静态方式交付，页面可直接在浏览器中打开。</p>
  </main>
</body>
</html>
