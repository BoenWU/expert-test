<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>500 · 服务器内部错误</title>
<style>
  *,
  *::before,
  *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    background-color: #f5f7fa;
    color: #0f172a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 560px;
    padding: 64px 24px;
    text-align: center;
  }

  .code {
    font-size: clamp(88px, 22vw, 148px);
    font-weight: 700;
    line-height: 1;
    letter-spacing: 0.04em;
    color: #0f172a;
  }

  h1 {
    margin-top: 24px;
    font-size: clamp(22px, 5vw, 30px);
    font-weight: 600;
    color: #1e293b;
  }

  .description {
    margin-top: 12px;
    font-size: 16px;
    line-height: 1.75;
    color: #475569;
  }

  .home-link {
    display: inline-block;
    margin-top: 40px;
    padding: 12px 36px;
    background-color: #1d4ed8;
    color: #ffffff;
    font-size: 16px;
    font-weight: 500;
    text-decoration: none;
    border-radius: 8px;
    transition: background-color 0.2s ease;
  }

  .home-link:hover {
    background-color: #1e40af;
  }

  .home-link:focus-visible {
    outline: 3px solid #93c5fd;
    outline-offset: 2px;
  }
</style>
</head>
<body>
<main class="container">
  <p class="code">500</p>
  <h1>服务器内部错误</h1>
  <p class="description">服务器在处理您的请求时遇到了内部错误，请稍后重试。</p>
  <a class="home-link" href="/">返回首页</a>
</main>
</body>
</html>
