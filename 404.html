<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - 页面未找到</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      background-color: #f5f5f7;
      color: #1d1d1f;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      text-align: center;
      max-width: 600px;
      width: 100%;
    }

    .error-code {
      font-size: 120px;
      font-weight: 700;
      line-height: 1;
      color: #0071e3;
      margin-bottom: 16px;
      letter-spacing: -2px;
    }

    .error-title {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #1d1d1f;
    }

    .error-message {
      font-size: 17px;
      color: #6e6e73;
      margin-bottom: 32px;
      line-height: 1.5;
    }

    .home-link {
      display: inline-block;
      padding: 12px 28px;
      background-color: #0071e3;
      color: #ffffff;
      text-decoration: none;
      border-radius: 980px;
      font-size: 17px;
      font-weight: 400;
      transition: background-color 0.2s ease;
    }

    .home-link:hover {
      background-color: #0077ed;
    }

    .home-link:active {
      background-color: #006edb;
    }

    @media (max-width: 768px) {
      .error-code {
        font-size: 80px;
      }

      .error-title {
        font-size: 22px;
      }

      .error-message {
        font-size: 15px;
      }

      .home-link {
        padding: 10px 24px;
        font-size: 15px;
      }
    }

    @media (max-width: 480px) {
      .error-code {
        font-size: 64px;
      }

      .error-title {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="error-code">404</div>
    <h1 class="error-title">页面未找到</h1>
    <p class="error-message">抱歉，您访问的页面不存在或已被移除。</p>
    <a href="/" class="home-link">返回首页</a>
  </div>
</body>
</html>
