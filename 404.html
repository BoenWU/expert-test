<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 · 页面未找到</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      height: 100%;
    }

    body {
      min-height: 100%;
      display: grid;
      place-items: center;
      background-color: #f7f8fa;
      color: #1f2937;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    main.error-page {
      text-align: center;
      padding: 64px 24px;
      max-width: 560px;
    }

    .error-code {
      font-size: 112px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: 0.04em;
      color: #111827;
    }

    .error-title {
      margin-top: 16px;
      font-size: 28px;
      font-weight: 600;
      color: #111827;
    }

    .error-desc {
      margin-top: 12px;
      font-size: 16px;
      color: #4b5563;
    }

    .error-actions {
      margin-top: 40px;
    }

    .btn-home {
      display: inline-block;
      padding: 12px 32px;
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      background-color: #1d4ed8;
      border: 1px solid #1d4ed8;
      border-radius: 6px;
      text-decoration: none;
      cursor: pointer;
    }

    .btn-home:hover {
      background-color: #1e40af;
      border-color: #1e40af;
    }

    .btn-home:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main class="error-page">
    <p class="error-code">404</p>
    <h1 class="error-title">页面未找到</h1>
    <p class="error-desc">当前地址不存在或已被移除，请检查链接是否正确。</p>
    <div class="error-actions">
      <a class="btn-home" href="/">返回首页</a>
    </div>
  </main>
</body>
</html>
