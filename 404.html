<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - 页面未找到</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      text-align: center;
      padding: 2rem;
      max-width: 520px;
    }

    .error-code {
      font-size: clamp(6rem, 18vw, 10rem);
      font-weight: 700;
      line-height: 1;
      color: #4263eb;
      letter-spacing: -0.04em;
    }

    .error-title {
      font-size: 1.5rem;
      font-weight: 600;
      margin-top: 1rem;
      color: #1a1a2e;
    }

    .error-desc {
      font-size: 1rem;
      color: #6c7184;
      margin-top: 0.75rem;
      line-height: 1.6;
    }

    .back-link {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.625rem 1.75rem;
      font-size: 0.95rem;
      font-weight: 500;
      color: #ffffff;
      background: #4263eb;
      border-radius: 6px;
      text-decoration: none;
      transition: background 0.2s ease;
    }

    .back-link:hover {
      background: #3b5bdb;
    }

    .back-link:active {
      background: #364fc7;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="error-code">404</div>
    <h1 class="error-title">页面未找到</h1>
    <p class="error-desc">抱歉，您访问的页面不存在或已被移动。</p>
    <a href="/" class="back-link">返回首页</a>
  </div>
</body>
</html>
