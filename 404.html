<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>页面不存在（404）</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f6f8;
      --surface: #ffffff;
      --text: #1f2329;
      --text-secondary: #5a6068;
      --accent: #2b5aed;
      --accent-strong: #1f46c8;
      --border: #e3e6ea;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 48px 24px;
      background: var(--bg);
      color: var(--text);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .error-page {
      width: 100%;
      max-width: 520px;
      padding: 48px 40px;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .error-code {
      margin: 0;
      font-size: 108px;
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: 6px;
      color: var(--text);
    }

    .error-divider {
      width: 48px;
      height: 3px;
      margin: 20px auto 24px;
      background: var(--accent);
      border-radius: 2px;
    }

    .error-title {
      margin: 0 0 12px;
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
    }

    .error-desc {
      margin: 0 0 32px;
      font-size: 15px;
      color: var(--text-secondary);
    }

    .back-home {
      display: inline-block;
      min-width: 144px;
      padding: 11px 28px;
      font-size: 15px;
      font-weight: 500;
      color: #ffffff;
      text-decoration: none;
      background: var(--accent);
      border-radius: 6px;
      transition: background-color 0.15s ease;
    }

    .back-home:hover {
      background: var(--accent-strong);
    }

    .back-home:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main class="error-page">
    <h1 class="error-code">404</h1>
    <div class="error-divider" aria-hidden="true"></div>
    <p class="error-title">抱歉，您访问的页面不存在</p>
    <p class="error-desc">您访问的地址可能有误，或该页面已被移动、删除。您可以返回首页继续浏览。</p>
    <a class="back-home" href="/">返回首页</a>
  </main>
</body>
</html>
